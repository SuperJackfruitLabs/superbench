name: check
on: {"push":{"branches":["main"],"tags":["**"]},"pull_request":{"types":["opened","synchronize","reopened"]}}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      trusted_ref: ${{ steps.trusted_ref.outputs.trusted_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: trusted_ref
        name: Verify protected current main through the server API
        env:
          CI_GATE_EVENT: ${{ github.event_name }}
          CI_GATE_REF: ${{ github.ref }}
          CI_GATE_API_URL: ${{ github.api_url }}
          CI_GATE_REPOSITORY: ${{ github.repository }}
          CI_GATE_SHA: ${{ github.sha }}
          CI_GATE_TOKEN: ${{ github.token }}
        run: python3 scripts/check-trusted-ref.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py

  privileged-identity:
    # Privileged proof is separate from ordinary CI. Only protected main pushes qualify;
    # missing/false API protection evidence disables it, including every PR and tag.
    # Runner admission must also enforce trusted source outside branch-editable YAML.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.trusted_ref == 'true'
    runs-on: [self-hosted, superbench-privileged]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py --privileged-only

  # superbench.dev (landing/): built on pull requests that touch it. Its own npm tree; the Go
  # checks above never read it. It deploys from the GitHub mirror, not from here.
  landing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did this pull request touch landing/?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- landing/ .forgejo/workflows/ci.yml; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
          else
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.touched == 'true'
        uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Build the site and check its frame and copy
        if: steps.changed.outputs.touched == 'true'
        working-directory: landing
        run: |
          npm ci --no-audit --no-fund
          npm run build
