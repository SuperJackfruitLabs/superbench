name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py

  privileged-identity:
    # Privileged proof is separate from ordinary CI. Only protected main pushes qualify;
    # missing/false protection metadata disables this job, including every PR and tag.
    # Runner admission must also enforce trusted source outside branch-editable YAML.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: [self-hosted, superbench-privileged]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py --privileged-only
