name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py

  privileged-identity:
    # No matching runner means pending proof, never a skipped or substituted pass.
    # Fork PR code is not automatically executed on a privileged self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, superbench-privileged]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py --privileged-only
