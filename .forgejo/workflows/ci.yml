name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python3 scripts/check-ci.py
